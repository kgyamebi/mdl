# Full stack — MariaDB + backend + frontend
# Usage: docker compose -f docker-compose.stack.yml up -d --build
# App: http://localhost:8081

services:
  mariadb:
    image: mariadb:11.4
    container_name: mdl-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
      MARIADB_DATABASE: ${DB_NAME:-mdl_platform}
      MARIADB_USER: ${DB_USER:-mdl_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    volumes:
      - mdl_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdl-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mdl_platform}
      DB_USER: ${DB_USER:-mdl_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-mdl-dev-secret-change-in-production-must-be-32-chars-minimum}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      OWNER_SEED_ENABLED: ${OWNER_SEED_ENABLED:-true}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: mdl-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  mdl_mariadb_data:
